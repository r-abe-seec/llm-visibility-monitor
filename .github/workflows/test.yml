- name: Install dependencies
  run: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt

- name: Run Ruff lint
  run: ruff check --output-format=github .

- name: Check Ruff formatting
  run: ruff format --check .

- name: Run mypy
  run: python -m mypy

- name: Run tests
  run: python -m pytest
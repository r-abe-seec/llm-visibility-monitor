prompts:
- id: hello_japanese
  category: test
  title: 日本語の挨拶
  text: 日本語で短く挨拶してください。
- id: recommend_ad_agencies
  category: brand_visibility
  title: おすすめの広告代理店
  text: 日本国内でおすすめの広告代理店を5社挙げ、それぞれの特徴を簡潔に説明してください。
- id: recommend_ga4_agencies
  category: brand_visibility
  title: GA4に強い会社
  text: 日本国内でGA4の導入や分析支援に強い会社を5社挙げてください。
- id: gen_recommendation
  category: recommendation
  title: おすすめ企業
  text: 葬儀社でおすすめの会社を5社挙げ、それぞれの特徴を簡潔に説明してください。
- id: gen_ranking
  category: ranking
  title: 主要企業ランキング
  text: 葬儀社の主要な会社を、評価が高い順にランキング形式で5社紹介してください。
- id: gen_selection
  category: selection
  title: 選び方とおすすめ
  text: 葬儀社を選ぶ際のポイントを説明したうえで、具体的におすすめの会社を挙げてください。
- id: gen_comparison
  category: comparison
  title: 競合比較
  text: 花葬儀と競合する葬儀社を3社挙げ、それぞれの強み・弱みを花葬儀と比較してください。
- id: gen_reputation
  category: reputation
  title: 評判
  text: 花葬儀の評判や強み・弱みについて、客観的に説明してください。
- id: gen_journey_urgent
  category: journey_urgent
  title: 緊急時の行動
  text: 身内が亡くなりました。まず何をすべきか順を追って教えてください。葬儀社はどう選べばよいか、信頼できる会社があればあわせて教えてください。
- id: gen_journey_cost
  category: journey_cost
  title: 費用相場
  text: 葬儀社の費用相場を教えてください。費用を抑えるコツと、料金が明確で信頼できる会社があれば教えてください。
- id: gen_journey_flow
  category: journey_flow
  title: 利用の流れ
  text: 葬儀社に依頼してから当日までの流れを教えてください。初めてでも安心して任せられる会社があれば教えてください。
- id: gen_journey_trust
  category: journey_trust
  title: 失敗回避
  text: 葬儀社選びで後悔・失敗しないための注意点を教えてください。そのうえで評判の良い会社を挙げてください。

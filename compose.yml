services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-visibility-monitor
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/gcloud/adc.json
    volumes:
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcloud/adc.json:ro
      - ./prompts:/app/prompts
    restart: unless-stopped